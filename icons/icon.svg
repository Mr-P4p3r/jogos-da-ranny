<!-- Bus Super Party app icon: party bus with a party hat over a purple confetti background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6a2fc0"/>
      <stop offset="1" stop-color="#1f0c45"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Confetti -->
  <g>
    <rect x="96" y="110" width="22" height="12" rx="3" fill="#ffd23f" transform="rotate(-25 107 116)"/>
    <rect x="400" y="120" width="22" height="12" rx="3" fill="#3fa7ff" transform="rotate(30 411 126)"/>
    <rect x="80" y="380" width="22" height="12" rx="3" fill="#3ddc84" transform="rotate(20 91 386)"/>
    <rect x="410" y="370" width="22" height="12" rx="3" fill="#ff7ac6" transform="rotate(-35 421 376)"/>
    <circle cx="150" cy="80" r="8" fill="#ff7ac6"/>
    <circle cx="360" cy="78" r="8" fill="#3ddc84"/>
    <circle cx="440" cy="250" r="7" fill="#ffd23f"/>
    <circle cx="70" cy="260" r="7" fill="#2ee6d6"/>
  </g>
  <!-- Bus shadow -->
  <ellipse cx="256" cy="392" rx="150" ry="16" fill="rgba(0,0,0,.3)"/>
  <!-- Bus body -->
  <rect x="96" y="196" width="320" height="170" rx="36" fill="#ff4d8d" stroke="#b8164f" stroke-width="10"/>
  <!-- Windows -->
  <rect x="124" y="222" width="70" height="62" rx="14" fill="#c9f0ff"/>
  <rect x="210" y="222" width="70" height="62" rx="14" fill="#c9f0ff"/>
  <rect x="296" y="222" width="94" height="62" rx="14" fill="#c9f0ff"/>
  <!-- Passengers in windows -->
  <circle cx="159" cy="262" r="20" fill="#ffd23f"/>
  <circle cx="245" cy="262" r="20" fill="#3fa7ff"/>
  <circle cx="335" cy="262" r="20" fill="#3ddc84"/>
  <!-- Stripe and lights -->
  <rect x="96" y="304" width="320" height="16" fill="#ffd23f"/>
  <circle cx="392" cy="342" r="10" fill="#fff6a8"/>
  <!-- Wheels -->
  <circle cx="170" cy="370" r="30" fill="#2a1450"/><circle cx="170" cy="370" r="12" fill="#b9a9d6"/>
  <circle cx="342" cy="370" r="30" fill="#2a1450"/><circle cx="342" cy="370" r="12" fill="#b9a9d6"/>
  <!-- Party hat on the roof -->
  <polygon points="206,200 306,200 268,86" fill="#ffd23f" stroke="#c99500" stroke-width="6" stroke-linejoin="round"/>
  <path d="M232 160 L284 160" stroke="#ff4d8d" stroke-width="12" stroke-linecap="round"/>
  <path d="M220 184 L296 184" stroke="#3fa7ff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="268" cy="84" r="18" fill="#fff"/>
</svg>
