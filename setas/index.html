<!doctype html>
<!--
  Setas da Festa: a single-file arrow escape puzzle.
  The board is packed with candy arrow pieces. Tap one and it flies off in the
  direction it points, but only if its path to the edge is clear; bumping into
  another piece costs a heart. Clear the whole board to win.
  Levels are procedurally generated (seeded) and always solvable.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Setas da Festa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#4a1f86;--bg2:#1a0b38;--ink:#fff;--accent:#ffd23f;--pink:#ff4d8d}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 15%,var(--bg1),var(--bg2) 75%);
    font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;left:0;top:0;width:420px;height:800px;transform-origin:0 0}
  canvas{position:absolute;left:0;top:0;width:420px;height:800px}
  #hud{position:absolute;left:0;top:0;width:420px;height:54px;display:flex;align-items:center;gap:8px;padding:8px 12px 0}
  #info{flex:1;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #lvl{font-size:22px;font-weight:800;letter-spacing:.5px}
  #pts{font-size:15px;font-weight:800;margin-top:3px;white-space:nowrap}
  #pts b{color:var(--accent)}
  .btn{border:0;border-radius:14px;font:inherit;font-weight:800;color:#2a1450;background:var(--accent);
    box-shadow:0 4px 0 #b88a00;cursor:pointer;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
  .btn:disabled{opacity:.4}
  .hb{height:38px;min-width:42px;padding:0 10px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .hb.alt{background:#fff;box-shadow:0 4px 0 #b9a9d6}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(20,6,45,.62);backdrop-filter:blur(3px)}
  #overlay.show{display:flex}
  .card{width:340px;background:#fff;color:#2a1450;border-radius:26px;padding:26px 22px 22px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .card h1{font-size:40px;line-height:1;color:var(--pink);margin-bottom:6px}
  .card h2{font-size:30px;line-height:1.1;margin-bottom:6px}
  .card p{font-size:17px;line-height:1.3;margin:8px 0;font-weight:600}
  .card .big{width:100%;height:58px;font-size:24px;margin-top:12px}
  .card .sec{background:#efe7ff;box-shadow:0 4px 0 #c9b8ef}
  .card .ded{color:var(--pink);font-size:18px}
  .chips{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
  .chips i{width:38px;height:38px;border-radius:12px;background:linear-gradient(var(--l),var(--c));box-shadow:0 4px 0 var(--d);
    display:flex;align-items:center;justify-content:center;animation:bob 1.6s ease-in-out infinite}
  .chips i:nth-child(2){animation-delay:.15s}.chips i:nth-child(3){animation-delay:.3s}.chips i:nth-child(4){animation-delay:.45s}
  .chips svg{width:24px;height:24px}
  @keyframes bob{50%{transform:translateY(-5px)}}
  .rows{margin:12px 0 4px;font-size:16px;font-weight:600}
  .rows div{display:flex;justify-content:space-between;padding:2px 6px}
  .rows .z{opacity:.4}
  .total{font-size:34px;font-weight:800;color:var(--pink);line-height:1.1;margin-top:6px}
  .rec{font-size:18px;font-weight:800}
  .rec.new{color:#e0a800;animation:pop .5s .3s both cubic-bezier(.2,1.6,.4,1)}
  .sum{font-size:15px;opacity:.7}
  #toast{position:absolute;left:50%;top:124px;transform:translateX(-50%);background:#fff;color:#2a1450;
    font-weight:800;font-size:18px;padding:6px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <a class="btn hb alt" id="bBack" href="../" title="Voltar aos jogos">←</a>
    <div id="info"><div id="lvl">Nível 1</div><div id="pts"></div></div>
    <button class="btn hb" id="bHint" title="Mostrar uma seta livre">💡 3</button>
    <button class="btn hb alt" id="bRestart" title="Recomeçar">↻</button>
    <button class="btn hb alt" id="bMute" title="Som">🔊</button>
  </div>
  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<script>
// Optional dedication shown on the start screen (leave empty to hide)
const DEDICATION = 'Feito com ❤ por Rafael para Ranny';

const VW = 420, VH = 800;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

// GEN-START
// Seeded RNG so a level is identical on every retry
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]]; // right, down, left, up

function levelParams(L){
  return {
    W: Math.min(9, 4 + Math.floor((L-1)/4)),
    H: Math.min(11, 4 + Math.floor((L-1)/3)),
    fill: Math.min(.95, .6 + L*.018),            // target share of covered cells
    long: L<6 ? 0 : Math.min(.4, .08 + (L-6)*.03), // chance a piece is 2-3 cells
    max3: L>=9,
    tangle: Math.min(2.6, .25 + L*.09),          // preference for blocking earlier pieces
    spread: Math.max(0, .9 - L*.08),             // early levels: avoid clumping pieces together
  };
}

function inside(p,x,y){return x>=0&&y>=0&&x<p.W&&y<p.H}
function pieceCells(pc){const [dx,dy]=DIRS[pc.dir],c=[];for(let k=0;k<pc.len;k++)c.push([pc.hx-dx*k,pc.hy-dy*k]);return c}
// True when nothing sits between (x,y) and the board edge in direction dir
function rayClear(grid,p,x,y,dir){
  const [dx,dy]=DIRS[dir]; x+=dx; y+=dy;
  while(inside(p,x,y)){ if(grid[y][x]!==-1) return false; x+=dx; y+=dy; }
  return true;
}
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Each new piece must have a clear exit past the pieces already placed,
// so removing them in reverse placement order always works (and no order can deadlock).
function genLevel(L){
  const p = levelParams(L), rnd = mulberry32(L*7919+31), N = p.W*p.H;
  const target = Math.max(4, Math.round(N*p.fill));
  let best = null, bestUsed = -1;
  for(let attempt=0; attempt<10; attempt++){
    const grid = Array.from({length:p.H},()=>Array(p.W).fill(-1));
    const cover = Array.from({length:p.H},()=>Array(p.W).fill(0)); // exit paths crossing each cell
    const pieces = []; let used = 0;
    while(used<target){
      let pick=null, ps=-1e9;
      for(const i of shuffle([...Array(N).keys()],rnd)){
        const hx=i%p.W, hy=(i/p.W)|0;
        if(grid[hy][hx]!==-1) continue;
        const ok=[]; for(let d=0;d<4;d++) if(rayClear(grid,p,hx,hy,d)) ok.push(d);
        for(const dir of ok){
          const [dx,dy]=DIRS[dir];
          let len = rnd()<p.long ? (p.max3&&rnd()<.4?3:2) : 1;
          // Shrink until the tail fits behind the head
          while(len>1){
            let fit=true;
            for(let k=1;k<len;k++){const x=hx-dx*k,y=hy-dy*k; if(!inside(p,x,y)||grid[y][x]!==-1){fit=false;break}}
            if(fit) break; len--;
          }
          let blocks=0, nb=0, same=0;
          for(let k=0;k<len;k++){
            const x=hx-dx*k, y=hy-dy*k; blocks+=cover[y][x];
            for(const [ax,ay] of DIRS) if(inside(p,x+ax,y+ay)&&grid[y+ay][x+ax]!==-1){ nb++; if(pieces[grid[y+ay][x+ax]].dir===dir) same++; }
          }
          const ray = dx>0 ? p.W-1-hx : dx<0 ? hx : dy>0 ? p.H-1-hy : hy;
          // Random + tangle bonus + long exit paths (more chance to be blocked later)
          // + fill hard-to-reach cells first (density) - clumping - same-direction runs
          const score = rnd() + p.tangle*(Math.min(3,blocks) + .8*ray/Math.max(p.W,p.H))
            + (4-ok.length)*.45 - p.spread*nb - .45*same/len;
          if(score>ps){ps=score; pick={len,dir,hx,hy}}
        }
      }
      if(!pick) break;
      const id=pieces.length;
      pieceCells(pick).forEach(([x,y])=>grid[y][x]=id);
      const [dx,dy]=DIRS[pick.dir]; let x=pick.hx+dx, y=pick.hy+dy;
      while(inside(p,x,y)){ cover[y][x]++; x+=dx; y+=dy; }
      pieces.push(pick); used+=pick.len;
    }
    if(used>bestUsed){best=pieces; bestUsed=used}
    if(used>=target) break;
  }
  return {p, pieces:best};
}
// GEN-END

// Candy palette, one color per direction: right, down, left, up
const PAL = [
  {c:'#ffb22e',l:'#ffdb7a',d:'#d4740c'}, // mango
  {c:'#2fd6a0',l:'#8af3cf',d:'#139167'}, // mint
  {c:'#3fb4ff',l:'#9edcff',d:'#1d74cc'}, // sky
  {c:'#ff5c9a',l:'#ffa6c9',d:'#cc2b68'}, // bubblegum
];
const CONF = ['#ffd23f','#ff5c9a','#3fb4ff','#2fd6a0','#ffb22e','#c58bff','#fff'];

// ---------- Layout ----------
const BOARD = {x:10, y:116, w:400, h:672};
const BAR_Y = 86;
let cell=60, ox=0, oy=0;
const STARS = Array.from({length:34},(_,i)=>({x:(i*97.3)%VW, y:60+((i*211.7)%(VH-60)), r:.8+(i%3)*.6, ph:i*1.7}));

// ---------- Audio ----------
let AC=null, muted=false, noiseBuf=null;
try{ muted = localStorage.getItem('bsp_muted')==='1' }catch(e){}
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC }
function tone(f,dur,type='sine',vol=.12,slide=0,delay=0){
  if(muted) return;
  try{
    const A=audio(), t = A.currentTime+delay, o=A.createOscillator(), g=A.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(A.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
// Filtered noise sweep for the fly-off whoosh
function whoosh(dur=.32,vol=.22){
  if(muted) return;
  try{
    const A=audio(), t=A.currentTime;
    if(!noiseBuf){ noiseBuf=A.createBuffer(1,A.sampleRate*.5,A.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const s=A.createBufferSource(), f=A.createBiquadFilter(), g=A.createGain();
    s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=1.4;
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(3200,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.3); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f).connect(g).connect(A.destination); s.start(t); s.stop(t+dur+.02);
  }catch(e){}
}
const sfx = {
  go(){whoosh(); tone(380,.16,'triangle',.07,2.2)},
  pop(c){tone(660+c*110,.1,'sine',.13,1.7); tone(1320+c*220,.07,'triangle',.05,1.3,.03)},
  bump(){tone(150,.18,'square',.07,.55); tone(90,.22,'sine',.14,.7); buzz([25,35,25])},
  hint(){[880,1175,1568].forEach((f,i)=>tone(f,.16,'sine',.08,0,i*.07))},
  win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.11,0,i*.1))},
  lose(){[392,330,262].forEach((f,i)=>tone(f,.25,'triangle',.1,0,i*.14))},
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- State ----------
let S = null;
let saved = 1;
try{ saved = Math.max(1, parseInt(localStorage.getItem('setas_level'))||1) }catch(e){}
// Best score per level: {level: points}
let best = {};
try{ best = JSON.parse(localStorage.getItem('setas_best'))||{} }catch(e){}
const fmt = n=>Math.round(n).toLocaleString('pt-BR');
const totalBest = ()=>Object.values(best).reduce((a,b)=>a+b,0);
function renderPts(){
  $('pts').innerHTML = `⭐ <b>${fmt(S.shown)}</b> &nbsp;🏆 ${fmt(best[S.level]||0)}`;
}

// Scoring
const PTS = {piece:10, cell:5, comboWindow:1.6, maxCombo:5, heart:50, noHint:100};
const HEARTS = 3, HINTS = 3;

function startLevel(L){
  const g = genLevel(L);
  cell = Math.min((BOARD.w-20)/g.p.W, (BOARD.h-20)/g.p.H, 76);
  ox = BOARD.x + (BOARD.w-cell*g.p.W)/2;
  oy = BOARD.y + (BOARD.h-cell*g.p.H)/2;
  const grid = Array.from({length:g.p.H},()=>Array(g.p.W).fill(-1));
  const pieces = g.pieces.map((pc,id)=>{
    pieceCells(pc).forEach(([x,y])=>grid[y][x]=id);
    return {...pc, id, state:'idle', off:0, t:0, shake:0, intro:-(pc.hx+pc.hy)*.035};
  });
  S = {
    level:L, p:g.p, grid, pieces,
    hearts:HEARTS, heartsShown:HEARTS, hints:HINTS, usedHint:false, rescued:false,
    over:false, endT:0, time:0, taps:0, bumps:0,
    score:0, shown:0, pts:{base:0,combo:0}, combo:0, lastRemove:-99,
    parts:[], floats:[], hintId:-1, hintT:0, flash:0,
  };
  $('lvl').textContent = 'Nível '+L;
  renderPts(); syncHint();
}

function isFree(pc){return rayClear(S.grid,S.p,pc.hx,pc.hy,pc.dir)}
const piecesLeft = ()=>S.pieces.filter(pc=>pc.state==='idle'||pc.state==='bump').length;

function tapPiece(pc){
  if(pc.state!=='idle'||S.hearts<=0||S.over) return;
  S.taps++;
  const [dx,dy]=DIRS[pc.dir];
  let x=pc.hx+dx, y=pc.hy+dy, f=0, blocker=-1;
  while(inside(S.p,x,y)){ if(S.grid[y][x]!==-1){blocker=S.grid[y][x];break} f++; x+=dx; y+=dy; }
  if(blocker>=0){
    S.hearts--; S.bumps++;
    pc.state='bump'; pc.t=0; pc.bumpD=f+.16; pc.blocker=blocker; pc.hit=false;
    return 'bump';
  }
  pieceCells(pc).forEach(([cx,cy])=>S.grid[cy][cx]=-1);
  pc.state='exit'; pc.v=5; pc.edgeD=f+.5; pc.edge=false;
  // Quick consecutive removals build a combo multiplier
  S.combo = S.time-S.lastRemove<=PTS.comboWindow ? Math.min(PTS.maxCombo,S.combo+1) : 1;
  S.lastRemove = S.time;
  const base = PTS.piece+(pc.len-1)*PTS.cell, gain = base*S.combo;
  S.score+=gain; S.pts.base+=base; S.pts.combo+=gain-base;
  const R=pieceRect(pc);
  S.floats.push({x:R.x+R.w/2, y:R.y+R.h/2, text:'+'+gain+(S.combo>1?'  x'+S.combo:''), life:1.1, combo:S.combo>1});
  if(S.hintId===pc.id) S.hintT=0;
  sfx.go(); buzz(12);
  return 'exit';
}

function useHint(){
  if(!S||S.over||S.hints<=0) return;
  if(S.hintT>0 && S.pieces[S.hintId].state==='idle') return;
  // The most recently placed piece still on the board is always free
  const free = S.pieces.filter(pc=>pc.state==='idle'&&isFree(pc));
  if(!free.length) return;
  S.hintId = free[free.length-1].id; S.hintT = 2.6;
  S.hints--; S.usedHint = true; syncHint(); sfx.hint();
}
function syncHint(){ $('bHint').textContent='💡 '+S.hints; $('bHint').disabled=S.hints<=0 }

function rescue(){
  if(!S||S.rescued||!S.over||S.overKind!=='lose') return;
  S.rescued=true; S.hearts=1; S.heartsShown=1; S.over=false; S.endT=0;
  hideOverlay(); toast('+1 coração! ❤'); tone(660,.15,'triangle',.1,1.5);
}

// ---------- Geometry ----------
const ease = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const backOut = t=>1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
const clamp01 = t=>Math.max(0,Math.min(1,t));
function pieceRect(pc){
  const [dx,dy]=DIRS[pc.dir], tx=pc.hx-dx*(pc.len-1), ty=pc.hy-dy*(pc.len-1);
  const x0=Math.min(pc.hx,tx), y0=Math.min(pc.hy,ty);
  let x=ox+(x0+dx*pc.off)*cell, y=oy+(y0+dy*pc.off)*cell;
  if(pc.shake>0){ const s=Math.sin(S.time*75)*cell*.07*(pc.shake/.35); x+=dy?s:s*.4; y+=dx?s:s*.4; }
  const g=cell*.06;
  return {x:x+g, y:y+g, w:(Math.abs(pc.hx-tx)+1)*cell-2*g, h:(Math.abs(pc.hy-ty)+1)*cell-2*g};
}
function headPoint(pc){
  const [dx,dy]=DIRS[pc.dir];
  return [ox+(pc.hx+.5+dx*pc.off)*cell, oy+(pc.hy+.5+dy*pc.off)*cell];
}
function tailPoint(pc){
  const [dx,dy]=DIRS[pc.dir], k=pc.len-.5;
  return [ox+(pc.hx+.5+dx*(pc.off-k))*cell, oy+(pc.hy+.5+dy*(pc.off-k))*cell];
}

// ---------- Update ----------
function confetti(x,y,n,color,speed=1){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(120+Math.random()*260)*speed;
    S.parts.push({k:'c',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-160*speed,r:Math.random()*6,vr:(Math.random()-.5)*12,
      c:color&&Math.random()<.6?color:CONF[Math.floor(Math.random()*CONF.length)],life:.7+Math.random()*.6});
  }
}

function update(dt){
  S.time+=dt;
  for(const pc of S.pieces){
    if(pc.intro<1) pc.intro=Math.min(1,pc.intro+dt*3.2);
    if(pc.shake>0) pc.shake=Math.max(0,pc.shake-dt);
    if(pc.state==='bump'){
      pc.t+=dt;
      const tf=Math.max(.07,pc.bumpD/15);
      if(pc.t<tf) pc.off=pc.bumpD*(pc.t/tf);
      else{
        if(!pc.hit){
          pc.hit=true; pc.shake=.3; S.pieces[pc.blocker].shake=.35;
          S.heartsShown=Math.max(S.hearts,S.heartsShown-1);
          S.parts.push({k:'h',x:28+S.heartsShown*34,y:BAR_Y,vx:(Math.random()-.5)*60,vy:-140,r:0,vr:(Math.random()-.5)*6,life:1});
          S.flash=.4; sfx.bump();
          const [hx,hy]=headPoint(pc), [dx,dy]=DIRS[pc.dir];
          for(let i=0;i<8;i++){const a=Math.atan2(-dy,-dx)+(Math.random()-.5)*2.2, s=80+Math.random()*120;
            S.parts.push({k:'s',x:hx+dx*cell*.5,y:hy+dy*cell*.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:2.5+Math.random()*2,c:'#fff',life:.35})}
        }
        const k=(pc.t-tf)/.26;
        pc.off=pc.bumpD*(1-ease(Math.min(1,k)));
        if(k>=1){ pc.off=0; pc.state='idle'; }
      }
    }else if(pc.state==='exit'){
      pc.v=Math.min(40,pc.v+75*dt); pc.off+=pc.v*dt;
      // Sparkle trail from the tail
      const [tx,ty]=tailPoint(pc), [dx,dy]=DIRS[pc.dir];
      for(let i=0;i<2;i++) S.parts.push({k:'s',x:tx+(Math.random()-.5)*cell*.4*Math.abs(dy||.3),y:ty+(Math.random()-.5)*cell*.4*Math.abs(dx||.3),
        vx:-dx*40+(Math.random()-.5)*40,vy:-dy*40+(Math.random()-.5)*40,s:2+Math.random()*3,c:Math.random()<.5?PAL[pc.dir].l:'#fff',life:.45});
      if(!pc.edge && pc.off>=pc.edgeD){
        pc.edge=true;
        const [hx,hy]=headPoint(pc);
        confetti(hx,hy,16,PAL[pc.dir].c,.7);
        S.parts.push({k:'r',x:hx,y:hy,r:cell*.2,c:PAL[pc.dir].l,life:.4});
        sfx.pop(S.combo);
      }
      if(pc.off>pc.edgeD+pc.len+5) pc.state='gone';
    }
  }
  if(S.hintT>0) S.hintT-=dt;
  if(S.flash>0) S.flash=Math.max(0,S.flash-dt);

  // Particles: c=confetti, s=sparkle, r=ring, h=lost heart
  for(let i=S.parts.length-1;i>=0;i--){
    const p=S.parts[i];
    if(p.k==='c'){ p.vy+=520*dt; p.vx*=.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; }
    else if(p.k==='s'){ p.vx*=.92; p.vy*=.92; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    else if(p.k==='r'){ p.r+=cell*2.4*dt; }
    else if(p.k==='h'){ p.vy+=500*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; }
    p.life-=dt;
    if(p.life<=0) S.parts.splice(i,1);
  }
  for(let i=S.floats.length-1;i>=0;i--){
    const f=S.floats[i]; f.y-=46*dt; f.life-=dt;
    if(f.life<=0) S.floats.splice(i,1);
  }
  if(S.shown<S.score){ S.shown=Math.min(S.score,S.shown+Math.max(1,Math.ceil((S.score-S.shown)*.15))); renderPts(); }

  if(S.over) return;
  // Win / lose detection
  const busy = S.pieces.some(pc=>pc.state==='bump'||pc.state==='exit');
  const won = !piecesLeft();
  const lost = !won && S.hearts<=0 && !busy;
  if((won&&!busy)||lost){ S.endT+=dt; if(S.endT>(won?.35:.6)) won?onWin():onLose(); }
  else S.endT=0;
}

// ---------- Drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function heartPath(x,y,r){
  ctx.beginPath(); ctx.moveTo(x,y+r*1.05);
  ctx.bezierCurveTo(x-r*1.6,y+r*.05,x-r*1.05,y-r*1.35,x,y-r*.5);
  ctx.bezierCurveTo(x+r*1.05,y-r*1.35,x+r*1.6,y+r*.05,x,y+r*1.05);
  ctx.closePath();
}
// Fat arrow along +x from -a to +a
function arrowPath(a,c){
  const hl=c*.27, hw=c*.25, sw=c*.09;
  ctx.beginPath(); ctx.moveTo(-a,-sw); ctx.lineTo(a-hl,-sw); ctx.lineTo(a-hl,-hw); ctx.lineTo(a,0);
  ctx.lineTo(a-hl,hw); ctx.lineTo(a-hl,sw); ctx.lineTo(-a,sw); ctx.closePath();
}

function drawPiece(pc,alpha,sc){
  const R=pieceRect(pc), col=PAL[pc.dir], lip=Math.max(3,cell*.085), r=Math.min(R.w,R.h)*.3;
  const fh=R.h-lip, cx=R.x+R.w/2, cy=R.y+fh/2;
  ctx.save(); ctx.globalAlpha=alpha;
  if(sc!==1){ ctx.translate(cx,R.y+R.h/2); ctx.scale(sc,sc); ctx.translate(-cx,-(R.y+R.h/2)); }
  ctx.fillStyle='rgba(16,4,40,.32)'; rr(R.x+1,R.y+lip+1.5,R.w,R.h-lip+1,r); ctx.fill();
  ctx.fillStyle=col.d; rr(R.x,R.y+lip,R.w,fh,r); ctx.fill();
  const gr=ctx.createLinearGradient(0,R.y,0,R.y+fh); gr.addColorStop(0,col.l); gr.addColorStop(.55,col.c); gr.addColorStop(1,col.c);
  ctx.fillStyle=gr; rr(R.x,R.y,R.w,fh,r); ctx.fill();
  // Candy gloss
  ctx.fillStyle='rgba(255,255,255,.34)'; rr(R.x+r*.45,R.y+lip*.45,R.w-r*.9,Math.min(fh*.4,cell*.3),r*.6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)'; circle(R.x+r*.7,R.y+r*.7,Math.max(1.5,cell*.035)); ctx.fill();
  // Arrow glyph
  const [dx,dy]=DIRS[pc.dir], a=(pc.len-1)*cell/2+cell*.27;
  ctx.lineJoin='round'; ctx.lineWidth=cell*.07;
  ctx.save(); ctx.translate(cx,cy+cell*.04); ctx.rotate(Math.atan2(dy,dx));
  arrowPath(a,cell); ctx.fillStyle=ctx.strokeStyle=col.d; ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(dy,dx));
  arrowPath(a,cell); ctx.fillStyle=ctx.strokeStyle='#fff'; ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.restore();
}

function drawGlow(pc,s){
  const R=pieceRect(pc), r=Math.min(R.w,R.h)*.3, e=6+s*4;
  ctx.save(); ctx.shadowColor='#ffe14d'; ctx.shadowBlur=18;
  rr(R.x-e,R.y-e,R.w+e*2,R.h+e*2,r+e); ctx.lineWidth=4; ctx.strokeStyle=`rgba(255,225,77,${.6+s*.4})`; ctx.stroke();
  ctx.restore();
}

function drawBar(){
  // Hearts
  for(let i=0;i<HEARTS;i++){
    const x=28+i*34, y=BAR_Y, on=i<S.heartsShown;
    const beat=on&&S.heartsShown===1?1+Math.abs(Math.sin(S.time*5))*.12:1;
    heartPath(x,y,11*beat);
    if(on){ ctx.fillStyle='#ff4d6d'; ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#a3123a'; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.55)'; circle(x-5,y-4,3); ctx.fill(); }
    else { ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fill(); }
  }
  ctx.font='800 17px "Baloo 2",sans-serif'; ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.fillText('Setas: '+piecesLeft(),VW-16,BAR_Y+6);
  // Combo meter
  const left=PTS.comboWindow-(S.time-S.lastRemove);
  if(S.combo>1 && left>0){
    const k=left/PTS.comboWindow, x=VW/2+4;
    ctx.textAlign='center'; ctx.font='800 19px "Baloo 2",sans-serif';
    ctx.lineWidth=4; ctx.strokeStyle='#2a1450'; ctx.strokeText('Combo x'+S.combo,x,BAR_Y+3);
    ctx.fillStyle='#ffd23f'; ctx.fillText('Combo x'+S.combo,x,BAR_Y+3);
    rr(x-40,BAR_Y+9,80,6,3); ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fill();
    rr(x-40,BAR_Y+9,80*k,6,3); ctx.fillStyle='#ffd23f'; ctx.fill();
  }
}

function draw(){
  ctx.clearRect(0,0,VW,VH);
  // Twinkling background dots
  for(const s of STARS){ ctx.globalAlpha=.15+.25*(.5+.5*Math.sin(S.time*1.6+s.ph)); circle(s.x,s.y,s.r); ctx.fillStyle='#fff'; ctx.fill(); }
  ctx.globalAlpha=1;
  drawBar();

  // Board
  const bw=cell*S.p.W, bh=cell*S.p.H;
  rr(ox-10,oy-10,bw+20,bh+20,24); ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.stroke();
  const g=cell*.1;
  ctx.fillStyle='rgba(16,4,40,.24)';
  for(let y=0;y<S.p.H;y++) for(let x=0;x<S.p.W;x++){ rr(ox+x*cell+g,oy+y*cell+g,cell-2*g,cell-2*g,cell*.22); ctx.fill(); }

  // Hint / tutorial glow under the pieces
  let glow=null;
  if(S.hintT>0 && S.pieces[S.hintId].state==='idle') glow=S.pieces[S.hintId];
  else if(S.level===1 && S.taps===0 && !S.over){ const f=S.pieces.filter(pc=>pc.state==='idle'&&isFree(pc)); glow=f[f.length-1]; }
  const pulse=.5+.5*Math.sin(S.time*7);
  if(glow) drawGlow(glow,pulse);

  for(const pc of S.pieces) if(pc.state==='idle') drawPiece(pc,1,pc===glow?1+pulse*.06:backOut(clamp01(pc.intro)));
  for(const pc of S.pieces) if(pc.state==='bump') drawPiece(pc,1,1);
  for(const pc of S.pieces) if(pc.state==='exit'){
    const k=clamp01((pc.off-pc.edgeD-.5)/4.5);
    drawPiece(pc,1-k,1-k*.35);
  }

  for(const p of S.parts){
    ctx.globalAlpha=Math.min(1,p.life*2.2);
    if(p.k==='c'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
    else if(p.k==='s'){ circle(p.x,p.y,p.s*Math.min(1,p.life*2.5)); ctx.fillStyle=p.c; ctx.fill(); }
    else if(p.k==='r'){ circle(p.x,p.y,p.r); ctx.lineWidth=4*p.life/.4; ctx.strokeStyle=p.c; ctx.stroke(); }
    else if(p.k==='h'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); heartPath(0,0,11); ctx.fillStyle='#ff4d6d'; ctx.fill(); ctx.restore(); }
  }
  ctx.globalAlpha=1;

  // Floating score popups
  ctx.textAlign='center'; ctx.lineJoin='round';
  for(const f of S.floats){
    ctx.globalAlpha=Math.min(1,f.life*2.5);
    ctx.font=`800 ${f.combo?22:19}px "Baloo 2",sans-serif`;
    const x=Math.max(50,Math.min(VW-50,f.x));
    ctx.lineWidth=5; ctx.strokeStyle='#2a1450'; ctx.strokeText(f.text,x,f.y);
    ctx.fillStyle=f.combo?'#ffd23f':'#fff'; ctx.fillText(f.text,x,f.y);
  }
  ctx.globalAlpha=1;

  // Red vignette when a heart is lost
  if(S.flash>0){
    const gr=ctx.createRadialGradient(VW/2,VH/2,VH*.3,VW/2,VH/2,VH*.7);
    gr.addColorStop(0,'rgba(255,40,90,0)'); gr.addColorStop(1,`rgba(255,40,90,${S.flash*.9})`);
    ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  }
}

// ---------- Screens ----------
function showOverlay(html){$('card').innerHTML=html; $('overlay').classList.add('show')}
function hideOverlay(){$('overlay').classList.remove('show')}
let toastT=0;
function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1300)}

function chip(c,deg){return `<i style="--c:${c.c};--l:${c.l};--d:${c.d}"><svg viewBox="-12 -12 24 24" style="transform:rotate(${deg}deg)"><path d="M-8 -2.4H2V-7L9 0 2 7V2.4H-8Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></i>`}

function startScreen(){
  showOverlay(`
    <h1>Setas da<br>Festa</h1>
    <div class="chips">${chip(PAL[3],-90)}${chip(PAL[0],0)}${chip(PAL[1],90)}${chip(PAL[2],180)}</div>
    ${DEDICATION?`<p class="ded">${DEDICATION}</p>`:''}
    <p>Toque numa seta e ela sai voando na direção que aponta.</p>
    <p>Se tiver outra peça no caminho, ela bate e você perde um ❤.</p>
    <p>Esvazie o tabuleiro! Travou? Peça uma dica 💡</p>
    ${totalBest()?`<p class="rec">🏆 Total de recordes: ${fmt(totalBest())}</p>`:''}
    <button class="btn big" id="oPlay">Jogar · Nível ${saved}</button>`);
  $('oPlay').onclick=()=>{hideOverlay(); startLevel(saved)};
}

function onWin(){
  S.over=true; S.overKind='win';
  saved=S.level+1; try{localStorage.setItem('setas_level',saved)}catch(e){}
  confetti(VW/2,320,130); sfx.win(); buzz([30,60,30]);
  // End-of-level bonuses
  const hearts=S.hearts*PTS.heart, noHint=S.usedHint?0:PTS.noHint;
  S.score+=hearts+noHint;
  const prev=best[S.level]||0, isRecord=S.score>prev;
  if(isRecord){ best[S.level]=S.score; try{localStorage.setItem('setas_best',JSON.stringify(best))}catch(e){} }
  const row=(label,v)=>`<div class="${v?'':'z'}"><span>${label}</span><span>+${fmt(v)}</span></div>`;
  setTimeout(()=>{
    const msgs=['Tabuleiro limpo!','Arrasou, Ranny!','Que voo!','Setas livres!','Mandou bem, Ranny!','Perfeito!'];
    showOverlay(`<h2>${msgs[S.level%msgs.length]} 🎉</h2><p>Nível ${S.level} concluído</p>
      <div class="rows">
        ${row('Setas',S.pts.base)}${row('Combos',S.pts.combo)}
        ${row('Corações restantes',hearts)}${row('Sem dicas',noHint)}
      </div>
      <div class="total">${fmt(S.score)} pontos</div>
      ${isRecord?`<div class="rec new">🏆 Novo recorde!${prev?` (antes: ${fmt(prev)})`:''}</div>`
                :`<div class="rec">🏆 Recorde: ${fmt(prev)}</div>`}
      <div class="sum">Total de todos os níveis: ${fmt(totalBest())}</div>
      <button class="btn big" id="oNext">Próximo nível</button>
      <button class="btn big sec" id="oAgain">Jogar de novo</button>`);
    $('oAgain').onclick=()=>{hideOverlay(); startLevel(S.level)};
    $('oNext').onclick=()=>{hideOverlay(); startLevel(saved)};
  },500);
}

function onLose(){
  S.over=true; S.overKind='lose'; sfx.lose();
  showOverlay(`<h2>Sem corações! 💔</h2><p>Antes de tocar, confira se o caminho da seta está livre.</p>
    ${S.rescued?'':'<button class="btn big" id="oRescue">+1 coração e continuar</button>'}
    <button class="btn big sec" id="oRetry">Tentar de novo</button>`);
  if(!S.rescued) $('oRescue').onclick=rescue;
  $('oRetry').onclick=()=>{hideOverlay(); startLevel(S.level)};
}

// ---------- Input & loop ----------
cv.addEventListener('pointerdown',e=>{
  if(!S||S.over) return;
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width*VW, py=(e.clientY-r.top)/r.height*VH;
  const gx=Math.floor((px-ox)/cell), gy=Math.floor((py-oy)/cell);
  if(!inside(S.p,gx,gy)) return;
  const id=S.grid[gy][gx];
  if(id>=0) tapPiece(S.pieces[id]);
});
$('bHint').onclick=useHint;
$('bRestart').onclick=()=>{ if(S){hideOverlay(); startLevel(S.level)} };
function syncMute(){$('bMute').textContent=muted?'🔇':'🔊'}
$('bMute').onclick=()=>{muted=!muted; syncMute(); try{localStorage.setItem('bsp_muted',muted?'1':'0')}catch(e){}};
syncMute();

function fit(){
  const vw=innerWidth, vh=innerHeight, s=Math.min(vw/VW,vh/VH);
  stage.style.transform=`translate(${(vw-VW*s)/2}px,${(vh-VH*s)/2}px) scale(${s})`;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(VW*s*dpr); cv.height=Math.round(VH*s*dpr);
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
}
addEventListener('resize',fit); fit();

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
startLevel(saved);
startScreen();
requestAnimationFrame(loop);

// Offline support when served over http(s)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register("../sw.js").catch(()=>{});
}
</script>
